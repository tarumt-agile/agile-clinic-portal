[project]
name = "agile-demo"
version = "0.1.0"
description = "Teaching repo: Agile + Tests + CI/CD"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
  "python-dotenv>=1.0",
  "itsdangerous>=2.1",
  "reportlab>=4.2",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "hypothesis",
  "pytest-bdd",
  "ruff==0.15.21",
  "black==26.5.1",
  "mypy",
  "fastapi[testclient]",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "sqlalchemy",
  "dnspython",
  "email-validator",
  "httpx",
  "pypdf>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "acceptance: BDD/Gherkin scenario tests (see tests/features/*.feature)",
  "io: tests that exercise a real system boundary (HTTP via TestClient, or a database session)",
]

[tool.mypy]
python_version = "3.11"
packages = ["src"]

[[tool.mypy.overrides]]
# reportlab ships no type stubs and CI's Type check step doesn't install
# types-reportlab (only types-requests) - ignore missing imports here rather
# than depend on that step installing something it doesn't ask for.
module = "reportlab.*"
ignore_missing_imports = true
